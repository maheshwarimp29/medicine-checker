<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Medicine Checker</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #edf4fc, #dceaff);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: white;
            border-radius: 18px;
            padding: 40px 35px;
            box-shadow: 0 15px 40px rgba(31, 78, 160, 0.15);
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 18px;
            border-radius: 16px;
            background: linear-gradient(135deg, #2864e8, #2149b9);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #183b75;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d7e1ef;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #2864e8;
            box-shadow: 0 0 0 3px rgba(40, 100, 232, 0.1);
        }

        button {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 9px;
            background: linear-gradient(135deg, #2864e8, #2149b9);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            opacity: 0.92;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
        }

        .message.error {
            display: block;
            background: #fff1f2;
            color: #be123c;
        }

        .message.success {
            display: block;
            background: #ecfdf5;
            color: #047857;
        }

        .register-text {
            text-align: center;
            margin-top: 24px;
            color: #718096;
            font-size: 14px;
        }

        .register-text a {
            color: #2864e8;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 22px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">M</div>

            <h1>Medicine Checker</h1>

            <p class="subtitle">
                Medicine Availability Management System
            </p>

            <div id="message" class="message"></div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" id="loginButton">
                    Login
                </button>

            </form>

            <div class="register-text">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </div>

        </div>

    </div>

    <script>

        const loginForm =
            document.getElementById("loginForm");

        const message =
            document.getElementById("message");

        const loginButton =
            document.getElementById("loginButton");


        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            message.className = "message";
            message.textContent = "";

            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";


            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            try {

                const response = await fetch(""https://medicine-checker.onrender.com/api/login"", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email,
                        password
                    })

                });


                const data = await response.json();


                if (!response.ok || !data.success) {

                    throw new Error(
                        data.message || "Login failed."
                    );
                }


                // Save logged-in user information
                localStorage.setItem(
                    "medicineCheckerUser",
                    JSON.stringify(data.user)
                );


                message.className =
                    "message success";

                message.textContent =
                    "Login successful. Opening dashboard...";


                setTimeout(function() {

                    window.location.href =
                        "dashboard.html";

                }, 700);


            } catch (error) {

                message.className =
                    "message error";

                message.textContent =
                    error.message ||
                    "Unable to login.";

            } finally {

                loginButton.disabled = false;
                loginButton.textContent = "Login";

            }

        });

    </script>

</body>
</html>
