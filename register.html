<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Medicine Checker</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #edf4fc, #dceaff);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 38px 35px;
            box-shadow: 0 15px 40px rgba(31, 78, 160, 0.15);
        }

        .logo {
            width: 62px;
            height: 62px;
            margin: 0 auto 18px;
            border-radius: 16px;
            background: linear-gradient(135deg, #2864e8, #2149b9);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #183b75;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d7e1ef;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2864e8;
            box-shadow: 0 0 0 3px rgba(40, 100, 232, 0.1);
        }

        button {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 9px;
            background: linear-gradient(135deg, #2864e8, #2149b9);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            opacity: 0.92;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
        }

        .message.error {
            display: block;
            background: #fff1f2;
            color: #be123c;
        }

        .message.success {
            display: block;
            background: #ecfdf5;
            color: #047857;
        }

        .login-text {
            text-align: center;
            margin-top: 22px;
            color: #718096;
            font-size: 14px;
        }

        .login-text a {
            color: #2864e8;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            .card {
                padding: 30px 22px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="logo">M</div>

            <h1>Create Account</h1>

            <p class="subtitle">
                Register for Medicine Checker
            </p>

            <div id="message" class="message"></div>

            <form id="registerForm">

                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Minimum 6 characters"
                        minlength="6"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your password"
                        minlength="6"
                        required
                    >
                </div>

                <button type="submit" id="registerButton">
                    Create Account
                </button>

            </form>

            <div class="login-text">
                Already have an account?
                <a href="index.html">Login</a>
            </div>

        </div>

    </div>


    <script>

        const registerForm =
            document.getElementById("registerForm");

        const message =
            document.getElementById("message");

        const registerButton =
            document.getElementById("registerButton");


        registerForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                message.className = "message";
                message.textContent = "";

                const name =
                    document.getElementById("name")
                    .value
                    .trim();

                const email =
                    document.getElementById("email")
                    .value
                    .trim();

                const password =
                    document.getElementById("password")
                    .value;

                const confirmPassword =
                    document.getElementById("confirmPassword")
                    .value;


                if (password !== confirmPassword) {

                    message.className =
                        "message error";

                    message.textContent =
                        "Passwords do not match.";

                    return;
                }


                registerButton.disabled = true;
                registerButton.textContent =
                    "Creating Account...";


                try {

                    const response = await fetch(
                        "/api/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                name,
                                email,
                                password
                            })
                        }
                    );


                    const data =
                        await response.json();


                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        throw new Error(
                            data.message ||
                            "Registration failed."
                        );
                    }


                    message.className =
                        "message success";

                    message.textContent =
                        "Account created successfully!";


                    registerForm.reset();


                    setTimeout(function() {

                        window.location.href =
                            "index.html";

                    }, 1000);


                } catch (error) {

                    message.className =
                        "message error";

                    message.textContent =
                        error.message ||
                        "Unable to create account.";

                } finally {

                    registerButton.disabled = false;

                    registerButton.textContent =
                        "Create Account";
                }

            }
        );

    </script>

</body>
</html>
